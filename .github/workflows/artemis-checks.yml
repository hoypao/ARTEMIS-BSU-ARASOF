name: ARTEMIS checks

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:

jobs:
  php-syntax-and-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: find app routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Eligibility unit tests
        run: vendor/bin/phpunit tests/Unit/EligibilityEngineTest.php
